# RigControl Configuration
BROKER_HOST=10.10.0.10
BROKER_PORT=1883
BROKER_USER=admin
BROKER_PASS=*****************
# Enables local SQLite telemetry history; also toggleable live via MQTT
STATS_DB_ENABLED=true
# Days of local telemetry history retained before pruning
STATS_DB_MAX_HISTORY_DAYS=7
# Seconds between automatic stats-DB snapshots, independent of dashboard refreshes
STATS_DB_INTERVAL_SECONDS=90
# Minimum seconds between telemetry pulls, prevents overlapping collection calls
MIN_TELEMETRY_PULL_INTERVAL_SECONDS=5
# Per-binary keryx stats API host/port (matches the Linux agent's <NAME>_API_HOST/<NAME>_API_PORT
# convention) - must match whatever --api-bind was passed to that binary's own command line, since
# its stats API is disabled unless explicitly bound. Only the pair matching whichever binary is
# actually running gets used; the other pair is harmless to leave set. Falls back to
# KERYX_API_HOST/KERYX_API_PORT (not set here) if a per-binary pair below is missing.
KERYX_MINER_API_HOST=127.0.0.1
KERYX_MINER_API_PORT=3338
KERYX_MINER_SUPR_API_HOST=127.0.0.1
KERYX_MINER_SUPR_API_PORT=3338
# Per-binary install paths (matches the Linux agent's <NAME>_BIN convention). Only needed if a rig's
# actual install location differs from the fleet-standard defaults baked into rigcontrol_telemetry.py
# (C:\miners\keryx-miner\keryx-miner.exe and C:\miners\keryx-miner-supr-windows-nvidia-pom\
# keryx-miner-supr.exe) - uncomment and edit whichever one needs to point somewhere else.
#KERYX_MINER_BIN=C:\miners\keryx-miner\keryx-miner.exe
#KERYX_MINER_SUPR_BIN=C:\miners\keryx-miner-supr-windows-nvidia-pom\keryx-miner-supr.exe
