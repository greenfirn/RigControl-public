persistence false
persistence_location /mosquitto/data/

log_dest stdout

listener 1883
protocol mqtt
allow_anonymous false
password_file /mosquitto/config/passwd
include_dir /mosquitto/config/conf.d

# encrypted MQTT (optional, see mosquitto-tls-setup.txt): uncomment this block and restart the broker.
# the 1883 listener above can stay while workers move over, remove it afterwards.
#listener 8883
#protocol mqtt
#cafile /mosquitto/config/certs/ca.crt
#certfile /mosquitto/config/certs/server.crt
#keyfile /mosquitto/config/certs/server.key
#tls_version tlsv1.2
##require_certificate true
#allow_anonymous false
#password_file /mosquitto/config/passwd
