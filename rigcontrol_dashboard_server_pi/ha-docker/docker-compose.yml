services:
  homeassistant:
    image: ghcr.io/home-assistant/home-assistant:stable
    container_name: homeassistant
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./homeassistant:/config
      - /etc/localtime:/etc/localtime:ro
    environment:
      - TZ=${TZ}

  nodered:
    image: nodered/node-red:latest
    container_name: nodered
    restart: unless-stopped
    environment:
      - TZ=${TZ}
      - NODE_RED_ENABLE_PROJECTS=true  # Enable projects feature
    volumes:
      - ./nodered:/data
      - ./nodered/alexa-cookies:/data/alexa-cookies
    network_mode: host

  zigbee2mqtt:
    image: koenkk/zigbee2mqtt
    container_name: zigbee2mqtt
    restart: unless-stopped
    # no depends_on: the mosquitto broker now runs in ~/rigcontrol-server
    # (set mqtt server/user/password in ./zigbee2mqtt/data/configuration.yaml)
    volumes:
      - ./zigbee2mqtt/data:/app/data
      - /run/udev:/run/udev:ro
    devices:
      - /dev/serial/by-id/usb-ITead_Sonoff_Zigbee_3.0_USB_Dongle_Plus_CHANGE_ME-if00-port0:/dev/ttyUSB0
    environment:
      - TZ=${TZ}
    network_mode: host
